<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<title>Media Intellectuel</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e8e6e1;font-family:'IBM Plex Sans',-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.container{max-width:640px;margin:0 auto;padding:32px 18px 80px}
.tag-line{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#e94560;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:900;letter-spacing:-0.5px;line-height:1.15;color:#f0ece4;margin-bottom:6px}
.subtitle{font-size:13px;color:#777;margin-bottom:28px}
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#999;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.tab.active{border-color:#e94560;background:#e94560;color:#0d0d0d}
.section{background:rgba(255,255,255,0.025);border-radius:12px;border:1px solid rgba(255,255,255,0.07);padding:20px 22px;margin-bottom:16px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.accent-bar{width:4px;height:22px;border-radius:2px}
.section-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#e8e6e1;letter-spacing:-0.3px;flex:1}
.badge-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:1px;color:#0d0d0d}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-bg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.07)}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s}
.progress-text{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#999;min-width:52px;text-align:right}
.card{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);transition:opacity 0.2s}
.card.compact{padding:10px 0}
.card.checked{opacity:0.38}
.check-btn{width:28px;height:28px;min-width:28px;border-radius:7px;border:2px solid rgba(255,255,255,0.18);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin-top:2px;padding:0}
.check-btn.on{border-color:#16c79a;background:rgba(22,199,154,0.18)}
.card-icon{font-size:28px;line-height:1;margin-top:2px}
.card.compact .card-icon{font-size:22px}
.card-body{flex:1;min-width:0}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-name{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:16px;color:#e8e6e1}
.card.compact .card-name{font-size:14px}
.card.checked .card-name{text-decoration:line-through}
.type-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;border:1.5px solid;white-space:nowrap}
.type-badge.podcast{border-color:#e94560;color:#e94560}
.type-badge.video{border-color:#4a8fe7;color:#4a8fe7}
.type-badge.lecture{border-color:#f0b429;color:#f0b429}
.card-duration{font-size:11px;color:#888;font-family:monospace}
.card-desc{margin-top:4px;font-size:12.5px;color:#999;line-height:1.4}
.card-link{margin-top:2px;font-size:11px;color:#666}
.rotation-list{background:rgba(255,255,255,0.02);border-radius:12px;border:1px solid rgba(255,255,255,0.05);padding:18px 20px}
.rotation-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#888;margin-bottom:14px}
.rotation-item{padding:10px 12px;margin-bottom:8px;border-radius:8px;border:1px solid transparent}
.rotation-item.active{background:rgba(22,199,154,0.08);border-color:rgba(22,199,154,0.25)}
.rotation-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#555}
.rotation-item.active .rotation-label{color:#16c79a}
.rotation-names{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:#666}
.rotation-item.active .rotation-names{color:#ccc}
.footer{text-align:center;font-size:11px;color:#444;margin-top:32px;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const DAILY=[
{id:"d1",name:"Géopolitique — Pierre Haski",type:"podcast",duration:"~3-4 min",icon:"🌍",link:"France Inter · lun→ven",desc:"Pierre Haski (ex-AFP/Libération, cofondateur Rue89) — L'actu internationale en 4 min, densité maximale. Rituel du matin"},
{id:"d2",name:"Le Point J",type:"podcast",duration:"~12 min",icon:"🇨🇭",link:"RTS · lun→jeu 17h",desc:"Une question d'actu, un·e expert·e (souvent académique suisse). Ancrage helvétique — option d'appoint"},
];
const WEEKLY={
1:{label:"Lundi — Métacognition & santé mentale",items:[
{id:"w1a",name:"Méta de Choc",type:"podcast",duration:"~1 h",icon:"🧠",desc:"Élisabeth Feytit — Pensée critique appliquée à soi, emprise, biais cognitifs. Indépendant, sans pub (financé par dons). Sept. 2026 : série « L'esprit critique, ça s'apprend ? ». Tier S"},
{id:"w1b",name:"Dingue",type:"podcast",duration:"~30 min",icon:"🧩",desc:"RTS, Adrien Zerbini — Santé mentale & neurodivergence : récits vécus + psychiatres/chercheurs. Bimensuel, en alternance avec Méta de Choc. Reprise 21 sept. Tier A"},
]},
2:{label:"Mardi — Stratégie & géopolitique",items:[
{id:"w2a",name:"Le Collimateur",type:"podcast",duration:"~1 h",icon:"🎯",desc:"Alexandre Jubelin (agrégé & dr. histoire) — Défense & stratégie, adossé à l'IFRI/Le Rubicon. 2-3 sorties/sem. : 1 épisode au choix. Tier S"},
]},
3:{label:"Mercredi — Pro : management, décision & data",items:[
{id:"w3a",name:"Outils du Manager",type:"podcast",duration:"~50 min",icon:"🧭",desc:"Cédric Watine (depuis 2009, 800+ ép.) — Management concret : délégation, feedback, décision, négociation. Invités type Olivier Sibony, Julien Pélabère. Tier A"},
{id:"w3b",name:"DataGen · IFTTD",type:"podcast",duration:"~40 min",icon:"🛠️",desc:"1 épisode au choix — DataGen (Robin Conquet : stratégies data, dbt, semantic layer) ou IFTTD (Bruno Soulez : craft, archi, IA en prod). Sauter les épisodes sponsorisés. Tier A"},
]},
4:{label:"Jeudi — Sciences & comportement (selon les sorties)",items:[
{id:"w4a",name:"EvoSapiens (ex-Homo Fabulus)",type:"vidéo",duration:"~40 min",icon:"🧬",desc:"Stéphane Debove (dr. biologie évolutive, ENS) — Psycho évolutionniste, comportement, sommeil, morale. Sourcé ligne à ligne, ~1/mois. Tier S"},
{id:"w4b",name:"ScienceEtonnante",type:"vidéo",duration:"~30 min",icon:"🔬",desc:"David Louapre (dr. physique, prix Jean-Perrin) — Physique, maths, IA. 2026 : tokamaks, crypto quantique, El Niño. ~1/mois. Tier S"},
{id:"w4c",name:"Le Réveilleur",type:"vidéo",duration:"~45 min",icon:"⚡",desc:"Rodolphe Meyer (dr. sciences de l'environnement) — Énergie, climat, ACV. Sources ADEME/GIEC publiées et annotées. ~1/mois. Tier S"},
]},
5:{label:"Vendredi — Philosophie & idées",items:[
{id:"w5a",name:"Monsieur Phi",type:"vidéo",duration:"~25 min",icon:"🎭",desc:"Thibaut Giraud (dr. logique, EHESS/Jean-Nicod) — Philo analytique, éthique, philo des LLM. Selon les sorties. Tier A"},
{id:"w5b",name:"Les Idées Larges",type:"vidéo",duration:"~22 min",icon:"💡",desc:"ARTE, Laura Raim & Youness Bousenna — Un·e chercheur·se, une question de société (Rancière, Orain, Alombert). Bimensuel. Tier A"},
]},
6:{label:"Samedi — Systémique, cartes & débat",items:[
{id:"w6a",name:"Sismique",type:"podcast",duration:"~1 h",icon:"🌊",desc:"Julien Devaureix — Enjeux systémiques : climat, énergie, IA, société. 2026 : série #IA en 10 épisodes. Tier A"},
{id:"w6b",name:"Le Dessous des Cartes",type:"vidéo",duration:"~12 min",icon:"🗺️",desc:"ARTE, Émilie Aubry — Géopolitique par les cartes ; la factualité par le territoire. Tier A"},
{id:"w6c",name:"Le Nouvel Esprit Public",type:"podcast",duration:"~1 h",icon:"🗣️",desc:"Philippe Meyer — Débat hebdo argumenté et courtois (Gnesotto, Padis, Wiegel, Foucher…) + « thématiques » avec un·e chercheur·se. Tier S"},
]},
0:{label:"Dimanche — Rotation mensuelle",rotation:true,items:[]},
};
const MONTHLY=[
[{id:"m0a",name:"Tribu",type:"podcast",icon:"🇨🇭",desc:"RTS La Première, Julien Magnollay — Société & sciences humaines, un invité universitaire par épisode"},
{id:"m0b",name:"Geopolitis",type:"vidéo",icon:"🌐",desc:"RTS / TV5Monde, Laurent Huguenin-Elie — Décryptage géopolitique depuis la Genève internationale (UNIGE, IHEID)"},
{id:"m0c",name:"CQFD",type:"podcast",icon:"⚗️",desc:"RTS La Première, Stéphane Gabioud — Le rendez-vous science & santé (EPFL, UNIGE, UNIL)"}],
[{id:"m1a",name:"Avec philosophie",type:"podcast",icon:"📖",desc:"France Culture, Géraldine Muhlmann — Philosophie exigeante, invités universitaires. Rythme quotidien"},
{id:"m1b",name:"La Conversation scientifique",type:"podcast",icon:"🧪",desc:"France Culture, Étienne Klein (physicien) — Épistémologie : réfléchir sur la science, pas que ses résultats"},
{id:"m1c",name:"Braincast",type:"podcast",icon:"🧠",desc:"Cerveau & Psycho — Un·e chercheur·se (psychiatre, neuroscientifique, épidémiologiste) par épisode. Bimensuel, ~35 min"},
{id:"m1d",name:"Fouloscopie",type:"vidéo",icon:"👥",desc:"Mehdi Moussaïd (Max Planck Berlin) — Science des foules & intelligence collective, expériences réelles. Rare (4-5/an) : rattrapage"}],
[{id:"m2a",name:"Paroles d'histoire",type:"podcast",icon:"📜",desc:"André Loez (historien) — Entretiens avec les historiens universitaires sur leurs travaux récents. Binge Audio"},
{id:"m2b",name:"Histoire Vivante",type:"podcast",icon:"🕰️",desc:"RTS La Première, Anaïs Kien — Séries de 5×27 min avec historiens & archives. Fichiers dispo 30 jours"},
{id:"m2c",name:"L'Histoire nous le dira",type:"vidéo",icon:"🏛️",desc:"Laurent Turcot (prof. UQTR) — Vulgarisation historique solide et sourcée"}],
[{id:"m3a",name:"Entendez-vous l'éco ?",type:"podcast",icon:"📈",desc:"France Culture, Aliette Hovine — Réflexion économique avec des chercheurs. Hebdo (lundi 14h), ~1 h"},
{id:"m3b",name:"Le Code a changé",type:"podcast",icon:"💻",desc:"France Inter, Xavier de La Porte — Numérique & société : IA affective, souveraineté, informaticiens (Abiteboul). 20-45 min"},
{id:"m3c",name:"La Tronche en Biais",type:"vidéo",icon:"🛡️",desc:"Thomas C. Durand (dr. biologie) — Zététique, débunkage, méthode sceptique. Prix Diderot. Redondant avec Méta de Choc : en rotation"}],
];

const DAYS_FR=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MONTHS_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function getWeekNum(d){const s=new Date(d.getFullYear(),0,1);const diff=(d-s+((s.getTimezoneOffset()-d.getTimezoneOffset())*60000))/86400000;return Math.floor((diff+s.getDay()+1)/7)}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function weekKey(d){return d.getFullYear()+"-W"+getWeekNum(d)}
function rotKey(d){return "R"+(getWeekNum(d)%MONTHLY.length)}

const STORE_KEY="media-planner-v5";

function loadState(){
  const now=new Date();
  const dk=dateKey(now),wk=weekKey(now),rk=rotKey(now);
  const fresh={daily:{_p:dk},weekly:{_p:wk},monthly:{_p:rk}};
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const s=JSON.parse(raw);
      return{
        daily:(s.daily&&s.daily._p===dk)?s.daily:fresh.daily,
        weekly:(s.weekly&&s.weekly._p===wk)?s.weekly:fresh.weekly,
        monthly:(s.monthly&&s.monthly._p===rk)?s.monthly:fresh.monthly,
      };
    }
  }catch(e){}
  return fresh;
}
function saveState(state){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}

let state=loadState();
let currentTab="today";

function isChecked(bucket,id){return !!(state[bucket]&&state[bucket][id])}
function toggle(bucket,id){
  state[bucket][id]=!state[bucket][id];
  saveState(state);
  render();
}
function countChecked(bucket,items){return items.filter(i=>isChecked(bucket,i.id)).length}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="className")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null)return;
    el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return el;
}

function checkSvg(){
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width","14");s.setAttribute("height","14");s.setAttribute("viewBox","0 0 14 14");s.setAttribute("fill","none");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M3 7.5L5.5 10L11 4");p.setAttribute("stroke","#16c79a");p.setAttribute("stroke-width","2.2");p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");
  s.appendChild(p);return s;
}

function renderCard(item,bucket,compact){
  const checked=isChecked(bucket,item.id);
  const btn=h("button",{className:"check-btn"+(checked?" on":""),onClick:()=>toggle(bucket,item.id)});
  if(checked)btn.appendChild(checkSvg());
  const typeCls=item.type==="podcast"?"podcast":item.type==="lecture"?"lecture":"video";
  const top=h("div",{className:"card-top"},
    h("span",{className:"card-name"},item.name),
    h("span",{className:"type-badge "+typeCls},item.type),
    item.duration?h("span",{className:"card-duration"},item.duration):null
  );
  const body=h("div",{className:"card-body"},top,
    item.desc?h("div",{className:"card-desc"},item.desc):null,
    item.link?h("div",{className:"card-link"},item.link):null
  );
  return h("div",{className:"card"+(compact?" compact":"")+(checked?" checked":"")},btn,h("span",{className:"card-icon"},item.icon),body);
}

function renderProgress(done,total,color){
  const pct=total?Math.round(done/total*100):0;
  return h("div",{className:"progress-wrap"},
    h("div",{className:"progress-bg"},h("div",{className:"progress-fill",style:{width:pct+"%",background:color}})),
    h("span",{className:"progress-text",style:{color:pct===100?"#16c79a":"#999"}},done+"/"+total+(pct===100?" ✓":""))
  );
}

function renderSection(title,accent,tag,items,bucket,compact){
  const done=countChecked(bucket,items);
  const header=h("div",{className:"section-header"},
    h("div",{className:"accent-bar",style:{background:accent}}),
    h("h2",{className:"section-title"},title),
    tag?h("span",{className:"badge-tag",style:{background:accent}},tag):null
  );
  return h("div",{className:"section"},header,
    renderProgress(done,items.length,accent),
    ...items.map(i=>renderCard(i,bucket,compact))
  );
}

function render(){
  const now=new Date();
  const dow=now.getDay();
  const wn=getWeekNum(now);
  const ri=wn%MONTHLY.length;
  const app=document.getElementById("app");
  app.innerHTML="";

  app.appendChild(h("p",{className:"tag-line"},"Media Intellectuel"));
  app.appendChild(h("h1",null,DAYS_FR[dow]+" "+now.getDate()+" "+MONTHS_FR[now.getMonth()]));
  app.appendChild(h("p",{className:"subtitle"},"Sem. "+wn+" · Rotation "+(ri+1)+"/"+MONTHLY.length+" · Noyau Tier S/A · perso · pro · socle suisse"));

  const tabs=h("div",{className:"tabs"},
    ...["today","week","month","all"].map((id,i)=>{
      const labels=["Aujourd'hui","Semaine","Rotation","Tout"];
      return h("button",{className:"tab"+(currentTab===id?" active":""),onClick:()=>{currentTab=id;render()}},labels[i]);
    })
  );
  app.appendChild(tabs);

  const weekDays=[1,2,3,4,5,6,0];
  const todayW=WEEKLY[dow];
  const monthlyItems=MONTHLY[ri];
  const allWeekly=weekDays.flatMap(d=>WEEKLY[d].items);

  if(currentTab==="today"||currentTab==="all"){
    app.appendChild(renderSection("Rituel quotidien","#e94560","~5 min",DAILY,"daily",true));
    if(todayW.rotation){
      app.appendChild(renderSection(todayW.label+" "+(ri+1),"#16c79a","aujourd'hui",monthlyItems,"monthly",false));
    }else{
      app.appendChild(renderSection(todayW.label,"#4a8fe7","aujourd'hui",todayW.items,"weekly",false));
    }
  }

  if(currentTab==="week"||currentTab==="all"){
    if(currentTab==="week"){
      const wd=countChecked("weekly",allWeekly);
      const box=h("div",{className:"section"},
        h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}},
          h("span",{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:"12px",color:"#999"}},"Progression semaine"),
          h("span",{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:"14px",fontWeight:"700",color:wd===allWeekly.length?"#16c79a":"#e8e6e1"}},wd+"/"+allWeekly.length)
        ),
        renderProgress(wd,allWeekly.length,"#4a8fe7")
      );
      app.appendChild(box);
    }
    weekDays.forEach(d=>{
      const w=WEEKLY[d];const isToday=d===dow;
      if(w.rotation){
        app.appendChild(renderSection(w.label+" "+(ri+1),isToday?"#e94560":"#333",isToday?"aujourd'hui":null,monthlyItems,"monthly",false));
      }else{
        app.appendChild(renderSection(w.label,isToday?"#e94560":"#333",isToday?"aujourd'hui":null,w.items,"weekly",false));
      }
    });
  }

  if(currentTab==="month"||currentTab==="all"){
    app.appendChild(renderSection("Rotation "+(ri+1),"#16c79a","sem. "+wn,monthlyItems,"monthly",false));
    const list=h("div",{className:"rotation-list"},h("h3",{className:"rotation-title"},"Cycle complet"));
    MONTHLY.forEach((group,gi)=>{
      const item=h("div",{className:"rotation-item"+(gi===ri?" active":"")},
        h("span",{className:"rotation-label"},"Rotation "+(gi+1)+(gi===ri?" ← active":"")),
        h("div",{className:"rotation-names"},...group.map((m,ii)=>h("span",null,m.icon+" "+m.name+(ii<group.length-1?" ·":""))))
      );
      list.appendChild(item);
    });
    app.appendChild(list);
  }

  app.appendChild(h("p",{className:"footer"},"Contenus francophones à haute densité · noyau Tier S/A + rotations · màj sept. 2026"));
}

render();
</script>
</body>
</html>
